<style>
* { box-sizing: border-box; }
body { margin: 0; background: #fff; color: #000; font: 400 1rem/1.5 "Acid Grotesk", "Arimo", Arial, Helvetica, sans-serif; }
.marco { max-width: 1180px; margin: 0 auto; padding: 0 24px; }
.tope { background: #000; color: #fff; padding: 22px 0 32px; }
.firma { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 0; font-size: .875rem; }
.firma span + span { border-left: 3px solid #ff6c3d; padding-left: 12px; }
h1 { font: 500 2.5rem/1.1 "Clarendon Graphic", "Besley", Georgia, serif; margin: 26px 0 0; }
main { padding: 32px 0 48px; }
main p { margin: 0 0 18px; font-size: 1.125rem; max-width: 60ch; }
form { display: grid; gap: 10px; max-width: 420px; }
label { font-size: .875rem; font-weight: 700; }
input[type="password"] { height: 3rem; padding: 0 14px; border: 1px solid #828282; border-radius: 0; font: inherit; font-size: 1.125rem; }
.recordar { display: flex; gap: 8px; align-items: center; font-weight: 400; cursor: pointer; }
.recordar input { width: 16px; height: 16px; margin: 0; accent-color: #000; }
button { justify-self: start; background: #000; color: #fff; border: 0; border-radius: 999px; padding: 10px 26px; font: inherit; font-weight: 500; cursor: pointer; }
button:hover:not(:disabled) { background: #00b7eb; color: #000; }
button:disabled { cursor: progress; }
.error { margin: 0; background: #ff6c3d; padding: 4px 10px; font-weight: 500; width: max-content; }
.error:empty { display: none; }
:focus-visible { outline: 2px solid #000; outline-offset: 2px; }
@media (max-width: 720px) { .marco { padding: 0 16px; } h1 { font-size: 2rem; } }
</style>

<body>
<header class="tope"><div class="marco">
  <p class="firma"><span>Herramienta de apoyo del Centro de Investigación en Psicología, Educación y Familia (CIPEF)</span><span>Facultad de Educación y Ciencias Sociales</span></p>
  <h1>Radar de convocatorias</h1>
</div></header>
<main><div class="marco">
  <p>Acceso para las investigadoras y los investigadores del CIPEF. Ingresa la contraseña del equipo.</p>
  <form id="acceso">
    <label for="clave">Contraseña</label>
    <input id="clave" type="password" autocomplete="current-password" required autofocus>
    <label class="recordar" for="recordar"><input id="recordar" type="checkbox"> Recordar en este navegador</label>
    <button type="submit" id="entrar">Entrar</button>
    <p class="error" id="error" role="alert"></p>
  </form>
</div></main>

const guardar = (accion, valor) => { try { accion === 'quitar' ? localStorage.removeItem(LLAVE) : localStorage.setItem(LLAVE, valor); } catch (e) { /* navegación privada */ } };

async function abrir(clave) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(clave), 'PBKDF2', false, ['deriveKey']);
  const llave = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(P.sal), iterations: P.iteraciones, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(P.iv) }, llave, bytes(P.datos)));
}

async function entrar(clave, recordar) {
  let html;
  try { html = await abrir(clave); } catch (e) { return false; }
  if (recordar) guardar('poner', clave);
  document.open(); document.write(html); document.close();
  return true;
}

document.getElementById('acceso').addEventListener('submit', async e => {
  e.preventDefault();
  const boton = document.getElementById('entrar');
  const error = document.getElementById('error');
  boton.disabled = true; boton.textContent = 'Abriendo…'; error.textContent = '';
  if (!(await entrar(document.getElementById('clave').value, document.getElementById('recordar').checked))) {
    boton.disabled = false; boton.textContent = 'Entrar'; error.textContent = 'Contraseña incorrecta.';
  }
});

let recordada = null;
try { recordada = localStorage.getItem(LLAVE); } catch (e) { /* navegación privada */ }
// Si la contraseña cambió, la recordada deja de servir y se olvida.
if (recordada) entrar(recordada, false).then(ok => { if (!ok) guardar('quitar'); });
</script>
